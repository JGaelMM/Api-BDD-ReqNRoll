services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: categoriesproducts-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      # Contraseña solo para desarrollo local; se puede sobrescribir con un archivo .env
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-CategoriesProducts_Dev1}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    container_name: categoriesproducts-api
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CategoriesProducts;User Id=sa;Password=${MSSQL_SA_PASSWORD:-CategoriesProducts_Dev1};TrustServerCertificate=True"
    ports:
      - "8080:8080"
    # La API aplica las migraciones al arrancar, así que espera a que SQL Server esté listo.
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
